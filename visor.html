<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe - Portafolio Digital</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .barra {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        .boton {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            background: white;
            color: #222;
            text-decoration: none;
            border-radius: 6px;
        }

        .visor {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
        }
    </style>
</head>

<body>

    <div class="barra">
        <a href="index.html" class="boton">← Volver al portafolio</a>

        <a href="informe.pdf"
           download="informe.pdf"
           class="boton">
            ⬇️ Descargar informe
        </a>
    </div>

    <iframe
        class="visor"
        src="informe.pdf">
    </iframe>

</body>
</html>
