<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Informe // Data Archive</title>

    <style>
        :root {
            --bg: #050509;
            --bg-soft: #0a0a12;
            --panel: #0d0d16;
            --border: rgba(255,255,255,0.12);
            --text: #f2f2f5;
            --text-muted: #8c8c9a;
            --accent: #8b5cf6;
            --accent-soft: rgba(139,92,246,0.15);
            --cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(139,92,246,0.12), transparent 35%),
                var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .barra {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 0 32px;

            background: rgba(5,5,9,0.92);
            border-bottom: 1px solid var(--border);

            position: relative;
            z-index: 10;

            backdrop-filter: blur(12px);
        }

        .barra::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--accent),
                var(--cyan),
                transparent
            );
        }

        /* =========================
           TITLE
        ========================= */

        .titulo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border: 1px solid var(--accent);
            background: var(--accent-soft);

            color: var(--accent);

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 0 20px rgba(139,92,246,0.18);
        }

        .titulo-texto {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .titulo-principal {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .titulo-secundario {
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* =========================
           BUTTONS
        ========================= */

        .acciones {
            display: flex;
            gap: 10px;
        }

        .boton {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 16px;

            border: 1px solid var(--border);

            background: var(--panel);
            color: var(--text);

            text-decoration: none;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 1px;

            transition: 0.25s ease;
        }

        .boton:hover {
            border-color: var(--accent);
            background: var(--accent-soft);

            box-shadow:
                0 0 20px rgba(139,92,246,0.15);

            transform: translateY(-1px);
        }

        .boton-descarga {
            border-color: rgba(34,211,238,0.35);
        }

        .boton-descarga:hover {
            border-color: var(--cyan);
            background: rgba(34,211,238,0.08);
        }

        /* =========================
           PDF AREA
        ========================= */

        .visor-container {
            height: calc(100vh - 76px);

            padding: 24px;

            position: relative;
        }

        .visor-panel {
            width: 100%;
            height: 100%;

            position: relative;

            border: 1px solid var(--border);

            background: #111;

            box-shadow:
                0 0 40px rgba(0,0,0,0.45),
                inset 0 0 30px rgba(139,92,246,0.03);

            overflow: hidden;
        }

        /* =========================
           HUD CORNERS
        ========================= */

        .visor-panel::before,
        .visor-panel::after {
            content: "";

            position: absolute;

            width: 30px;
            height: 30px;

            pointer-events: none;

            z-index: 2;
        }

        .visor-panel::before {
            top: -1px;
            left: -1px;

            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
        }

        .visor-panel::after {
            bottom: -1px;
            right: -1px;

            border-bottom: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
        }

        /* =========================
           PDF
        ========================= */

        .visor {
            width: 100%;
            height: 100%;

            display: block;

            border: none;

            background: white;
        }

        /* =========================
           STATUS
        ========================= */

        .estado {
            position: absolute;

            bottom: 8px;
            left: 32px;

            z-index: 5;

            padding: 6px 10px;

            background: rgba(5,5,9,0.85);

            border: 1px solid var(--border);

            color: var(--text-muted);

            font-size: 9px;
            letter-spacing: 1.5px;

            pointer-events: none;
        }

        .estado span {
            color: var(--cyan);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            .barra {
                height: auto;
                min-height: 76px;

                padding: 14px 16px;

                flex-direction: column;
                align-items: stretch;
            }

            .titulo {
                justify-content: center;
            }

            .acciones {
                justify-content: center;
                flex-wrap: wrap;
            }

            .visor-container {
                height: calc(100vh - 130px);
                padding: 12px;
            }

            .boton {
                flex: 1;
                justify-content: center;
            }

            .estado {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header class="barra">

        <div class="titulo">

            <div class="logo">
                //
            </div>

            <div class="titulo-texto">
                <div class="titulo-principal">
                    DATA ARCHIVE
                </div>

                <div class="titulo-secundario">
                    Informe académico // Portafolio digital
                </div>
            </div
                
        </div>


        <div class="acciones">

            <a href="index.html" class="boton">
                ← VOLVER
            </a>

            <a
                href="informe.pdf"
                download="informe.pdf"
                class="boton boton-descarga"
            >
                ↓ DESCARGAR INFORME
            </a>

        </div>

    </header>


    <main class="visor-container">

        <div class="visor-panel">

            <iframe
                class="visor"
                src="informe.pdf"
                title="Visor del informe académico">
            </iframe>

            <div class="estado">
                SYSTEM STATUS:
                <span>DOCUMENT LOADED</span>
            </div>

        </div>

    </main>

</body>
</html>
