<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor // Data Archive</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-soft: #161b22;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-soft: rgba(88, 166, 255, 0.15);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .barra {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 0 30px;
            background: rgba(13, 17, 23, 0.9);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .titulo { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 35px; height: 35px;
            display: grid; place-items: center;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 16px; font-weight: bold;
        }
        .titulo-texto { display: flex; flex-direction: column; gap: 2px; }
        .titulo-principal { font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        .titulo-secundario { color: var(--text-muted); font-size: 11px; }

        .acciones { display: flex; gap: 10px; }
        .boton {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            text-decoration: none;
            font-size: 12px; font-weight: 500;
            transition: 0.2s ease;
        }
        .boton:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-1px);
        }
        .boton-descarga { border-color: rgba(88, 166, 255, 0.4); }
        .boton-descarga:hover { border-color: var(--accent); }

        .visor-container { height: calc(100vh - 70px); padding: 20px; }
        .visor-panel {
            width: 100%; height: 100%;
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .visor { width: 100%; height: 100%; display: block; border: none; }

        .estado {
            position: absolute; bottom: 10px; left: 20px;
            z-index: 5; padding: 5px 10px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-muted); font-size: 10px;
            pointer-events: none;
        }
        .estado span { color: var(--accent); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .barra {
                height: auto; min-height: 70px; padding: 15px;
                flex-direction: column; align-items: stretch;
            }
            .titulo { justify-content: center; }
            .acciones { justify-content: center; flex-wrap: wrap; }
            .visor-container { height: calc(100vh - 120px); padding: 10px; }
            .boton { flex: 1; justify-content: center; }
            .estado { display: none; }
        }
    </style>
</head>
<body>
    <header class="barra">
        <div class="titulo">
            <div class="logo">//</div>
            <div class="titulo-texto">
                <div class="titulo-principal">DATA ARCHIVE</div>
                <div class="titulo-secundario" id="subtitulo">Informe académico // Portafolio digital</div>
            </div>
        </div>
        <div class="acciones">
            <a href="index.html" class="boton">← VOLVER</a>
            <a href="informe.pdf" download class="boton boton-descarga" id="boton-descarga">↓ DESCARGAR</a>
        </div>
    </header>

    <main class="visor-container">
        <div class="visor-panel">
            <iframe class="visor" src="informe.pdf" title="Visor del informe académico" id="iframe-pdf"></iframe>
            <div class="estado">SYSTEM STATUS: <span>DOCUMENT LOADED</span></div>
        </div>
    </main>
    
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var pdf = params.get("pdf") || "informe.pdf";
            var titulo = params.get("titulo") || "Informe académico";

            var iframe = document.getElementById("iframe-pdf");
            if (iframe) {
                iframe.src = pdf;
                iframe.title = titulo;
            }

            var boton = document.getElementById("boton-descarga");
            if (boton) {
                boton.href = pdf;
                boton.setAttribute("download", pdf.split("/").pop());
            }

            var sub = document.getElementById("subtitulo");
            if (sub && params.get("titulo")) {
                sub.textContent = titulo + " // Portafolio digital";
            }
        })();
    </script>
</body> 
</html>
